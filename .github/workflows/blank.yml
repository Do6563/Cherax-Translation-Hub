name: Auto Increment Per Language
on:
  push:
    branches:
      - main
    paths:
      - 'Translations/*.json'
      - 'Translations_Vanilla/*.json'  
      - 'changelogs/*.txt'
jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect Changed Files and Bump Versions
        run: |
          set -uo pipefail
          mkdir -p Versions
          mkdir -p "changelogs versions"

          CHANGED_JSONS=$(git diff --diff-filter=d --name-only HEAD^ HEAD 2>/dev/null | grep -E "^(Translations|Translations_Vanilla)/.*\.json$" || true)

          if [ -n "$CHANGED_JSONS" ]; then
            echo "Changed translation files:"
            echo "$CHANGED_JSONS"
            for FILE in $CHANGED_JSONS; do
              BASENAME=$(basename "$FILE" .json)
              DIRNAME=$(dirname "$FILE")
              
              if [ "$DIRNAME" = "Translations_Vanilla" ]; then
                VERSION_FILE="Versions/${BASENAME}_Vanilla_version.txt"
              else
                VERSION_FILE="Versions/${BASENAME}_version.txt"
              fi

              if [ ! -f "$VERSION_FILE" ]; then
                echo 0 > "$VERSION_FILE"
              fi

              CURRENT_VER=$(cat "$VERSION_FILE" 2>/dev/null | tr -d '\r\n' | tr -cd '0-9')
              CURRENT_VER=${CURRENT_VER:-0}
              NEW_VER=$((CURRENT_VER + 1))
              echo "$NEW_VER" > "$VERSION_FILE"
              echo "Bumping JSON $BASENAME in $DIRNAME to version $NEW_VER"
            done
          else
            echo "No translation files changed."
          fi

          CHANGED_LOGS=$(git diff --diff-filter=d --name-only HEAD^ HEAD 2>/dev/null | grep "^changelogs/.*\.txt$" || true)

          if [ -n "$CHANGED_LOGS" ]; then
            echo "Changed changelog files:"
            echo "$CHANGED_LOGS"
            for FILE in $CHANGED_LOGS; do
              BASENAME=$(basename "$FILE" .txt)
              LANG_NAME=${BASENAME#changelogs_}

              VERSION_FILE="changelogs versions/version_${LANG_NAME}.txt"

              if [ ! -f "$VERSION_FILE" ]; then
                echo 0 > "$VERSION_FILE"
              fi

              CURRENT_VER=$(cat "$VERSION_FILE" 2>/dev/null | tr -d '\r\n' | tr -cd '0-9')
              CURRENT_VER=${CURRENT_VER:-0}
              NEW_VER=$((CURRENT_VER + 1))
              echo "$NEW_VER" > "$VERSION_FILE"
              echo "Bumping Changelog $LANG_NAME to version $NEW_VER"
            done
          else
            echo "No changelog files changed."
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add Versions/*.txt 2>/dev/null || true
          git add "changelogs versions/"*.txt 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-bump versions for updated languages and changelogs"
            git pull --rebase origin main
            git push origin main
          fi
