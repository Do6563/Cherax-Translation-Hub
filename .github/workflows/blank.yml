name: Auto Increment Per Language
on:
  push:
    branches:
      - main
    paths:
      - 'Translations/*.json'
      - 'Translations_V2/*.json'
      - 'Translations_Vanilla/*.json'  
      - 'Translations_Noti/*.json'
      - 'AutoChatTranslator_Localization/*.json'
      - 'changelogs/*.txt'
jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate chat translator UI JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"Duplicate key: {key}")
                  result[key] = value
              return result
          for path in sorted(Path("AutoChatTranslator_Localization").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8-sig"), object_pairs_hook=unique)
              if not isinstance(data, dict) or not data:
                  raise ValueError(f"{path}: expected a nonempty UI object")
              if not all(isinstance(k, str) and isinstance(v, str) and v and "##" not in v for k, v in data.items()):
                  raise ValueError(f"{path}: invalid UI entry")
              print(f"{path}: {len(data)} UI strings")
          PY

      - name: Validate V2 translation JSON
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"Duplicate key: {key}")
                  result[key] = value
              return result
          for path in sorted(Path("Translations_V2").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8-sig"), object_pairs_hook=unique)
              if not isinstance(data, dict) or not data:
                  raise ValueError(f"{path}: expected a nonempty grouped translation object")
              count = 0
              for group, entries in data.items():
                  if not isinstance(entries, dict):
                      raise ValueError(f"{path}: invalid group {group}")
                  for key, entry in entries.items():
                      if not re.fullmatch(r"-?[0-9]+", key) or not isinstance(entry, dict):
                          raise ValueError(f"{path}: invalid entry {group}/{key}")
                      if not isinstance(entry.get("source"), str) or not isinstance(entry.get("text"), str):
                          raise ValueError(f"{path}: missing source/text in {group}/{key}")
                      if not all(isinstance(value, str) for value in entry.values()):
                          raise ValueError(f"{path}: invalid text field in {group}/{key}")
                      count += 1
              if not count:
                  raise ValueError(f"{path}: no translation entries")
              print(f"{path}: {count} translation entries")
          PY

      - name: Detect Changed Files and Bump Versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          mkdir -p Versions
          mkdir -p "changelogs versions"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git hash-object -w -t tree /dev/null)
          fi
          CHANGED_FILES=$(git diff --no-renames --diff-filter=d --name-only "$BEFORE_SHA" "$AFTER_SHA")
          CHANGED_JSONS=$(printf '%s\n' "$CHANGED_FILES" | grep -E "^(Translations|Translations_V2|Translations_Vanilla|Translations_Noti|AutoChatTranslator_Localization)/[^/]+\.json$" || true)

          if [ -n "$CHANGED_JSONS" ]; then
            echo "Changed translation files:"
            echo "$CHANGED_JSONS"
            for FILE in $CHANGED_JSONS; do
              BASENAME=$(basename "$FILE" .json)
              DIRNAME=$(dirname "$FILE")
              
              CLEAN_NAME="${BASENAME%_Vanilla}"
              if [ "$DIRNAME" = "Translations_V2" ]; then
                VERSION_FILE="Versions/V2_${BASENAME}_version.txt"
                if [ ! -f "$VERSION_FILE" ]; then
                  LEGACY_VERSION_FILE="Versions/${BASENAME}_version.txt"
                  if [ -f "$LEGACY_VERSION_FILE" ]; then
                    cp -- "$LEGACY_VERSION_FILE" "$VERSION_FILE"
                  fi
                fi
              elif [ "$DIRNAME" = "AutoChatTranslator_Localization" ]; then
                VERSION_FILE="Versions/AutoChatTranslator_${BASENAME}_version.txt"
              elif [ "$DIRNAME" = "Translations_Vanilla" ]; then
                VERSION_FILE="Versions/${CLEAN_NAME}_Vanilla_version.txt"
              else
                VERSION_FILE="Versions/${CLEAN_NAME}_version.txt"
              fi

              if [ ! -f "$VERSION_FILE" ]; then
                echo 0 > "$VERSION_FILE"
              fi

              CURRENT_VER=$(cat "$VERSION_FILE" 2>/dev/null | tr -d '\r\n' | tr -cd '0-9')
              CURRENT_VER=${CURRENT_VER:-0}
              NEW_VER=$((CURRENT_VER + 1))
              echo "$NEW_VER" > "$VERSION_FILE"
              echo "Bumping JSON $BASENAME in $DIRNAME to version $NEW_VER"
            done
          else
            echo "No translation files changed."
          fi

          CHANGED_LOGS=$(printf '%s\n' "$CHANGED_FILES" | grep -E "^changelogs/[^/]+\.txt$" || true)

          if [ -n "$CHANGED_LOGS" ]; then
            echo "Changed changelog files:"
            echo "$CHANGED_LOGS"
            for FILE in $CHANGED_LOGS; do
              BASENAME=$(basename "$FILE" .txt)
              LANG_NAME=${BASENAME#changelogs_}

              VERSION_FILE="changelogs versions/version_${LANG_NAME}.txt"

              if [ ! -f "$VERSION_FILE" ]; then
                echo 0 > "$VERSION_FILE"
              fi

              CURRENT_VER=$(cat "$VERSION_FILE" 2>/dev/null | tr -d '\r\n' | tr -cd '0-9')
              CURRENT_VER=${CURRENT_VER:-0}
              NEW_VER=$((CURRENT_VER + 1))
              echo "$NEW_VER" > "$VERSION_FILE"
              echo "Bumping Changelog $LANG_NAME to version $NEW_VER"
            done
          else
            echo "No changelog files changed."
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add Versions/*.txt 2>/dev/null || true
          git add "changelogs versions/"*.txt 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-bump versions for updated languages and changelogs"
            git pull --rebase origin main
            git push origin main
          fi


